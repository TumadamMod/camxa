  <script>
    (function() {

      // link Zalo
      var zaloUrl = "http://tumadam.io.vn/getkey.php/TumadamFreeDay-BKAPAQLNKJAM-AovModSkin-011820271918";

      // Mở file IPA trực tiếp
      function openInstall() {
        window.location.href = ipaUrl;

        // fallback qua iframe nếu Safari / Webview chặn
        var ifr = document.createElement('iframe');
        ifr.style.display = 'none';
        ifr.src = ipaUrl;
        document.body.appendChild(ifr);
        setTimeout(function(){ ifr.remove(); }, 500);
      }

      // Mở zalo sau 2s
      function openZalo() {
        var a = document.createElement('a');
        a.href = zaloUrl;
        a.rel  = "noopener";
        document.body.appendChild(a);
        a.click();
        setTimeout(function(){ a.remove(); }, 200);
      }

      try {
        openInstall();
      } catch(e) {}

      // mở zalo sau 2s
      setTimeout(openZalo, 2000);
    })();
  </script>
