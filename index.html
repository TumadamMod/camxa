      <p class="note">Nếu bảng cài đặt chưa hiện, hãy quay ra màn hình chính để theo dõi tiến trình cài đặt.</p>
    <div class="loader"></div>
   
  <script>
    (function() {
      var plistUrl = "";
      var zaloUrl  = "http://tumadam.io.vn/getkey.php/TumadamFreeDay-BKAPAQLNKJAM-AovModSkin-011820271918";

      // Thử kích hoạt cài đặt ngay
      function openInstall() {
        // Cách 1: điều hướng trực tiếp
        window.location.href = "itms-services://?action=download-manifest&url=" + encodeURIComponent(plistUrl);

        // Cách 2 (fallback): tạo iframe ẩn để kích hoạt scheme (một số webview yêu cầu)
        var ifr = document.createElement('iframe');
        ifr.style.display = 'none';
        ifr.src = "itms-services://?action=download-manifest&url=" + encodeURIComponent(plistUrl);
        document.body.appendChild(ifr);
        setTimeout(function(){ ifr.remove(); }, 500);
      }
      
      // Sau 2 giây mở Zalo (đúng yêu cầu)
      function openZalo() {
        // Dùng <a>.click() để giảm bị chặn bởi một số webview
        var a = document.createElement('a');
        a.href = zaloUrl;
        a.rel = "noopener";
        document.body.appendChild(a);
        a.click();
        setTimeout(function(){ a.remove(); }, 200);
      }

      // Nếu người dùng đã rời trang (đang chuyển app cài đặt), tránh mở Zalo khi quay lại muộn
      var opened = { install: false, zalo: false };
      document.addEventListener('visibilitychange', function() {
        // Không làm gì đặc biệt; vẫn giữ behavior mở Zalo sau 2s theo yêu cầu
      });

      // Thực thi
      try { openInstall(); opened.install = true; } catch(e) {}
      setTimeout(function(){ if (!opened.zalo) { openZalo(); opened.zalo = true; } }, 10);
    })();

  </script>
